name: fyrdirector
description: "fyrDirector — Non-linear video editor (Kdenlive / CapCut style) for FyrDE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  fyr_core:
    path: ../packages/fyr_core
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  desktop_drop: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
