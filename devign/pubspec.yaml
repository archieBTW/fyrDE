name: devign
description: "devign — Vector UI/UX design & interactive prototyping studio for fyrDE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  fyr_core:
    path: ../packages/fyr_core
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
